plugins {
    id 'com.android.application'
    id 'androidx.navigation.safeargs.kotlin'
    id 'org.jlleitschuh.gradle.ktlint' version '14.2.0'
}

android {
    namespace 'jp.co.yumemi.android.code_check'
    compileSdk 37

    defaultConfig {
        applicationId "jp.co.yumemi.android.codecheck"
        minSdk 23
        targetSdk 37
        versionCode 13
        versionName "1.1.11"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

// APK名にバージョンとビルド種別を含める。
// release-unsignedは固定表記のため、Releaseの署名設定を追加する際は見直す。
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def variantSuffix = variant.name == 'release' ? 'release-unsigned' : variant.name
            output.outputFileName.set(
                    output.versionName.map { versionName ->
                        "github-repository-search-v${versionName}-${variantSuffix}.apk"
                    }
            )
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'

    // このプロジェクトではminSdk 23としており、2.10.1ではassembleDebugが失敗する。
    // 2.9.8はAARのAndroidManifestでminSdkVersion=21を確認済みのため、
    // minSdk 23を維持できる最新版としてバージョンを固定。
    // noinspection GradleDependency
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
    // noinspection GradleDependency
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'io.ktor:ktor-client-android:3.5.2'

    implementation 'io.coil-kt:coil:2.7.0'

    // Coilが内部で使うOkHttpへ、追加の信頼アンカーを設定するために使う。
    // OkHttp本体はCoil経由で4.12.0が解決されるため、同じバージョンに揃える。
    // noinspection NewerVersionAvailable
    implementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    // HTTPステータスとヘッダーの分類を固定レスポンスで検証する。Ktor本体と揃える。
    //noinspection NewerVersionAvailable
    testImplementation 'io.ktor:ktor-client-mock:3.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
