name: CI

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ main ]

permissions:
  contents: read

# PRの古い実行はキャンセルし、main更新は実行ごとに分ける。
concurrency:
  group: >-
    ci-${{ github.workflow }}-${{ github.ref }}-${{
      github.event_name == 'push' && github.run_id || 'pr'
    }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  ktlint:
    name: ktlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: ktlintCheck
        run: ./gradlew :app:ktlintCheck

      - name: Upload ktlint report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ktlint-report-${{ github.sha }}
          path: app/build/reports/ktlint/
          retention-days: 14

  test:
    name: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Unit test
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-report-${{ github.sha }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Assemble & Android Lint
        run: ./gradlew --continue :app:assembleDebug :app:assembleRelease :app:lintDebug

      - name: Upload Android Lint report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lint-report-${{ github.sha }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.sarif
          retention-days: 14

      - name: Upload Debug APK
        if: github.event_name == 'push' && success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # mainのCI成功後、バージョン更新があれば検証済みSHAへタグを作る。
  # バージョン比較とタグ操作は.github/scripts/に分離する。
  tag:
    name: tag
    needs: [ build, ktlint ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # 更新前後を比較するため、履歴と対象SHAを取得する。
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # 失敗時はジョブが止まり、タグ作成へ進まない。
      - name: Resolve release tag
        id: resolve
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: bash .github/scripts/resolve-release-tag.sh "$BEFORE_SHA" "$AFTER_SHA" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        if: steps.resolve.outputs.changed == 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: bash .github/scripts/create-release-tag.sh "$TAG" "$TARGET_SHA"