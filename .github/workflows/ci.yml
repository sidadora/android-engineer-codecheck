name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ktlint:
    name: ktlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: ktlintCheck
        run: ./gradlew :app:ktlintCheck

      - name: Upload ktlint report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ktlint-report-${{ github.sha }}
          path: app/build/reports/ktlint/
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Assemble & Android Lint
        run: ./gradlew --continue :app:assembleDebug :app:assembleRelease :app:lintDebug

      - name: Upload Android Lint report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lint-report-${{ github.sha }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.sarif
          retention-days: 14

      - name: Upload Debug APK
        if: github.event_name == 'push' && success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14